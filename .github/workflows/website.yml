name: website

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # `next build` only typechecks what it bundles, so test files were never
      # checked — one had a type error on main.
      - run: pnpm typecheck
      - run: pnpm test
      # `pnpm build` chains both export guards itself (check-out.mjs, then
      # check-og-image.mjs) — that is what makes them cover Cloudflare Pages,
      # which runs its own build and never sees this workflow. The social-card
      # guard is repeated as an explicit step so unchaining it from `build`
      # can't take it out of CI silently.
      - run: pnpm build
      - run: pnpm check:og-image
