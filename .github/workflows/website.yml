name: website

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # `next build` only typechecks what it bundles, so test files were never
      # checked — one had a type error on main.
      - run: pnpm typecheck
      - run: pnpm test
      # `pnpm build` chains both export guards itself (check-out.mjs, then
      # check-og-image.mjs) — that is what makes them cover Cloudflare Pages,
      # which runs its own build and never sees this workflow. The social-card
      # guard is repeated as an explicit step so unchaining it from `build`
      # can't take it out of CI silently.
      - run: pnpm build
      - run: pnpm check:og-image
