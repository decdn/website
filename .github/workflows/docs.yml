name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".markdownlint-cli2.jsonc"
      - ".prettierrc.json"
      - ".prettierignore"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - ".markdownlint-cli2.jsonc"
      - ".prettierrc.json"
      - ".prettierignore"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm exec prettier --check "docs/**/*.{md,mdx,json}"
      - name: markdownlint
        run: pnpm exec markdownlint-cli2
      # `website.yml` has `paths-ignore: docs/**`, so a docs-only change never
      # runs the suite there. `docs/canonical-host.js` is the one piece of
      # executable code under `docs/` and it has a test, so run vitest here too.
      - name: Tests
        run: pnpm test
      - name: Mintlify broken-link check
        working-directory: docs
        run: npx -y mintlify@4.2.555 broken-links
