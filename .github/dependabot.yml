# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # Dependabot assigns a dependency to the first group it matches, so
      # react and next must stay above dev-dependencies — otherwise their
      # dev-side packages (@types/react*, eslint-config-next) get pulled
      # into that batch and drift from the runtime package.
      #
      # react and react-dom must ship the exact same version — bumped apart,
      # the test suite fails React's version-mismatch check. @types/react*
      # ride along so type and runtime majors land together.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # next and eslint-config-next are pinned to the same exact version and
      # move together.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      # Majors stay out of the dev batch so one breaking bump can't hold its
      # patch/minor updates hostage; they arrive as their own PRs (unless
      # ignored below).
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next@16 pulls in eslint-plugin-react@7.37, which only
      # peers eslint ^9 and crashes on v10 (context.getFilename() removed).
      # Unblock when Next ships an eslint-plugin-react that supports v10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
