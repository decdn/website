# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # react and react-dom must ship the exact same version — bumped apart,
      # the test suite fails React's version-mismatch check.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      # Majors stay out of the group so one breaking bump can't hold the
      # patch/minor batch hostage; they arrive as their own PRs.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next@16 pulls in eslint-plugin-react@7.37, which only
      # peers eslint ^9 and crashes on v10 (context.getFilename() removed).
      # Unblock when Next ships an eslint-plugin-react that supports v10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
