# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # eslint-config-next@16 pulls in eslint-plugin-react@7.37, which only
      # peers eslint ^9 and crashes on v10 (context.getFilename() removed).
      # Unblock when Next ships an eslint-plugin-react that supports v10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # The *.lock.yml workflows are `gh aw compile` output. Bumping this pin on its own
      # desynchronises it from the awf binary version, the gh-aw-firewall image tag and the
      # embedded gh-aw-manifest header, which only a recompile can move together. Update it
      # with `gh aw compile` instead.
      - dependency-name: "github/gh-aw-actions/setup"
